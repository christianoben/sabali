name: Sabali validation

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::ggplot2
            any::DT
            any::rio
            any::foreign
            any::haven
            any::readxl
            any::openxlsx
            any::officer
            any::flextable
            any::MASS
            any::quantreg
            any::glmnet
            any::pls
            any::lmtest
            any::geepack
            any::lme4
            any::survival
            any::jsonlite
            any::httr2
            any::rcompanion
            any::DescTools
            any::renv
            any::shinytest2
            any::covr
            any::lintr
            any::styler
      - name: Restore the pinned renv baseline
        run: Rscript -e 'renv::restore(lockfile = "renv.lock", prompt = FALSE)'
      - name: Run headless and adversarial validation
        run: Rscript tests/run_all.R
      - name: Verify package structure and dependency lock
        run: Rscript tests/test_validate_static.R
      - name: Lint and style gate
        run: |
          Rscript -e 'l <- lintr::linters_with_defaults(); l <- l[c("equals_na_linter", "T_and_F_symbol_linter", "vector_logic_linter")]; x <- lintr::lint_dir("R", linters = l); if (length(x)) { print(x); quit(status = 1) }'
          Rscript -e 'styler::style_dir("R", dry = "on")'
      - name: Word report, security, fuzz, scale, and coverage checks
        run: |
          Rscript tests/test_validate_security.R
          Rscript tests/test_validate_report.R
          Rscript tests/test_validate_fuzz.R
          Rscript tests/test_validate_performance.R
          Rscript tests/test_coverage.R
      - name: Browser UI smoke gate
        run: Rscript tests/test_shinytest2_smoke.R
