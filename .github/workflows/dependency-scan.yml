name: Sabali dependency scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::jsonlite any::httr2
      - name: Query OSV for pinned CRAN versions
        run: Rscript tools/dependency_scan.R
